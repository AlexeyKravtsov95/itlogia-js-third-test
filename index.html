<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="homework-form">
    <div class="main-form">
        <div class="logo">
            <img src="images/logo.png" alt="Homeworks logo">
        </div>
        <div class="info">
            <div class="info-title">
                Get your free account
            </div>
            <div class="info-subtitle">
                Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever) anytime.
            </div>
        </div>
        <div class="form">
            <label for="full-name-input" id="full-name-label">
                Full Name
                <input type="text" id="full-name-input" class="base-input">
            </label>
            <label for="username-input" id="username-label">
                Your Username
                <input type="text" id="username-input" class="base-input">
            </label>
            <label for="email-input" id="email-label">
                E-mail
                <input type="text" id="email-input" class="base-input">
            </label>
            <label for="password-input" id="password-label">
                Password
                <input type="password" id="password-input" class="base-input">
            </label>
            <label for="repeat-password-input" id="repeat-password-label">
                Repeat Password
                <input type="password" id="repeat-password-input" class="base-input">
            </label>
            <div class="agree">
                <input type="checkbox" id="agree-check">
                <label for="agree-check">
                    Agree to our Terms of Service and Privacy Statement
                </label>
            </div>
        </div>
        <div class="actions">
            <button class="btn" id="sign-up">Sign up</button>
        </div>
        <div class="check-account">
            <a href="#" class="link-account">Already have an account?</a>
        </div>
        <div class="popup" id="success-popup">
            <div class="popup-inner">
                <p class="popup-text">
                    На вашу почту выслана ссылка, перейдите по ней, чтобы завершить регистрацию
                </p>
                <button class="popup-close" id="popup-close">ОК</button>
            </div>
        </div>
    </div>
    <div class="main-image">
        <img src="images/rocket.png" alt="Rocket image">
    </div>
</section>
<script src="js/index.js"></script>
</body>
</html>
